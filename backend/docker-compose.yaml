services:
  postgres:
    image: postgres:latest
    container_name: codedb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: shaik
      POSTGRES_USER: shaik
      POSTGRES_DB: mydb
    volumes:
      - codedb:/var/lib/postgresql

  redis:
    image: redis:latest
    container_name: redisdb
    ports:
      - "6379:6379"
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis:/data
    command: redis-server /usr/local/etc/redis/redis.conf

volumes:
  codedb:
  redis: